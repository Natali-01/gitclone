<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простая страница</title>
    <link rel="stylesheet" href="style.css">
	<style>
        /* Базовые настройки для всей страницы */
        body {
            font-family: sans-serif;
            line-height: 1.6;
            margin: 40px auto;
            max-width: 800px;
            padding: 0 20px;
            color: #333;
        }

        /* Стили для ссылок */
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }

        /* Настройки списков */
        ul {
            padding-left: 20px;
        }

        /* Оформление разделительных линий */
        hr {
            border: 0;
            border-top: 1px solid #ccc;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Название сайта</h1>
        <p>Краткое описание или слоган</p>
    </header>

    <hr>

    <main>
        <section>
            <h2>О проекте</h2>
            <p>Это пример простой веб-страницы. Здесь нет встроенных CSS-стилей, поэтому браузер отображает элементы по умолчанию.</p>
        </section>

        <section>
            <h2>Основные ссылки</h2>
            <ul>
                <li><a href="#">Главная страница</a></li>
                <li><a href="#">Контакты</a></li>
            </ul>
        </section>
    </main>

    <hr>

    <footer>
        <p>© 2026 Мой первый сайт</p>
    </footer>

</body>
</html>
